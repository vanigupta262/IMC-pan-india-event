<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Trade Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="card">
            <div class="card-content">
                <!-- Header -->
                <div class="auth-header">
                    <div class="auth-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                    </div>
                    <h1 class="auth-title">Create Account</h1>
                    <p class="auth-subtitle">Join the Trade Simulation platform</p>
                </div>

                <!-- Error Alert (hidden by default) -->
                <div id="signup-error" class="alert alert-error hidden">
                    <svg class="alert-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="signup-error-message">Registration failed</span>
                </div>

                <!-- Success Alert (hidden by default) -->
                <div id="signup-success" class="alert alert-success hidden">
                    <svg class="alert-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span id="signup-success-message">Account created! Redirecting...</span>
                </div>

                <!-- Signup Form -->
                <form id="signup-form">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" class="form-input" placeholder="johndoe" required
                            minlength="3">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required
                            minlength="6">
                        <p class="text-sm text-gray-500 mt-1">Must be at least 6 characters</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required>
                        <p id="password-match-error" class="form-error hidden">Passwords do not match</p>
                    </div>

                    <button type="submit" class="btn btn-primary w-full" id="signup-btn">
                        <span id="signup-btn-text">Sign Up</span>
                        <div id="signup-spinner" class="spinner hidden"
                            style="width: 1rem; height: 1rem; border-width: 2px;"></div>
                    </button>
                </form>

                <!-- Footer Link -->
                <div class="auth-footer">
                    Already have an account? <a href="login.html">Sign in</a>
                </div>
            </div>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-4">
            <a href="index.html" class="text-sm text-gray-500"
                style="display: inline-flex; align-items: center; gap: 0.5rem;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Home
            </a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';

        // Password match validation
        document.getElementById('confirm-password').addEventListener('input', function () {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const errorEl = document.getElementById('password-match-error');

            if (confirmPassword && password !== confirmPassword) {
                errorEl.classList.remove('hidden');
                this.classList.add('form-input-error');
            } else {
                errorEl.classList.add('hidden');
                this.classList.remove('form-input-error');
            }
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            const errorDiv = document.getElementById('signup-error');
            const successDiv = document.getElementById('signup-success');
            const btnText = document.getElementById('signup-btn-text');
            const spinner = document.getElementById('signup-spinner');
            const btn = document.getElementById('signup-btn');

            // Hide alerts
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            // Validate passwords match
            if (password !== confirmPassword) {
                document.getElementById('signup-error-message').textContent = 'Passwords do not match';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Validate password length
            if (password.length < 6) {
                document.getElementById('signup-error-message').textContent = 'Password must be at least 6 characters';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Show loading
            btn.disabled = true;
            btnText.textContent = 'Creating account...';
            spinner.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store user data
                    localStorage.setItem('userId', data.id);
                    localStorage.setItem('username', data.username || username);
                    localStorage.setItem('email', email);

                    // Show success
                    successDiv.classList.remove('hidden');

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    document.getElementById('signup-error-message').textContent = data.detail || 'Registration failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('signup-error-message').textContent = 'Failed to connect to server. Is the backend running?';
                errorDiv.classList.remove('hidden');
                console.error(error);
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Sign Up';
                spinner.classList.add('hidden');
            }
        });

        // Check if already logged in
        if (localStorage.getItem('userId')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>

</html>
